  </defs>
  <rect width="680" height="600" fill="url(#bg)"/><rect width="680" height="600" fill="url(#grid)"/>
  <circle cx="520" cy="130" r="150" fill="#60a5fa" fill-opacity=".08"/><circle cx="130" cy="500" r="130" fill="#2563eb" fill-opacity=".08"/>
